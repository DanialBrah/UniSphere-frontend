  <ellipse cx="32" cy="22" rx="22" ry="5.5" fill="none" stroke="#9333EA" stroke-width="0.8" opacity="0.45"/>
  <ellipse cx="32" cy="42" rx="22" ry="5.5" fill="none" stroke="#9333EA" stroke-width="0.8" opacity="0.45"/>
  <!-- Longitude lines -->
  <ellipse cx="32" cy="32" rx="8" ry="29" fill="none" stroke="#7C3AED" stroke-width="1.2" opacity="0.6"/>
  <ellipse cx="32" cy="32" rx="18" ry="29" fill="none" stroke="#9333EA" stroke-width="0.8" opacity="0.35"/>
  <!-- Network connection lines -->
  <line x1="32" y1="3" x2="56" y2="18" stroke="#7C3AED" stroke-width="0.8" opacity="0.5"/>
  <line x1="56" y1="18" x2="56" y2="46" stroke="#7C3AED" stroke-width="0.8" opacity="0.5"/>
  <line x1="56" y1="46" x2="32" y2="61" stroke="#7C3AED" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="61" x2="8" y2="46" stroke="#7C3AED" stroke-width="0.8" opacity="0.5"/>
  <line x1="8" y1="46" x2="8" y2="18" stroke="#7C3AED" stroke-width="0.8" opacity="0.5"/>
  <line x1="8" y1="18" x2="32" y2="3" stroke="#7C3AED" stroke-width="0.8" opacity="0.5"/>
  <!-- Cross lines -->
  <line x1="8" y1="18" x2="56" y2="46" stroke="#9333EA" stroke-width="0.7" opacity="0.4"/>
  <line x1="56" y1="18" x2="8" y2="46" stroke="#9333EA" stroke-width="0.7" opacity="0.4"/>
  <!-- Network nodes -->
  <circle cx="32" cy="3" r="3.5" fill="#6B21A8"/>
  <circle cx="56" cy="18" r="3" fill="#7C3AED"/>
  <circle cx="56" cy="46" r="3" fill="#7C3AED"/>
